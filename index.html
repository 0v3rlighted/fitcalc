<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FitCalc Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #0f1012; --card: #1c1e22; --accent: #2ecc71; --text: #ffffff; --text-sec: #94a3b8; --danger: #ef4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; line-height: 1.5; }
        .hidden { display: none !important; }
        
        /* Карточки и элементы */
        .card { background: var(--card); padding: 20px; border-radius: 20px; margin-bottom: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .stats-grid { display: flex; justify-content: space-between; margin-top: 15px; border-top: 1px solid #2d3139; padding-top: 15px; }
        .stat-item { text-align: center; }
        .stat-val { display: block; font-weight: bold; font-size: 16px; }
        .stat-label { font-size: 11px; color: var(--text-sec); text-transform: uppercase; }

        /* Прогресс-бар */
        .progress-container { background: #2d3139; height: 8px; border-radius: 4px; overflow: hidden; margin: 10px 0; }
        .progress-fill { background: var(--accent); height: 100%; width: 0%; transition: width 0.5s ease; }

        /* Управление датами */
        .date-control { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 10px; }
        .date-btn { background: #2d3139; border: none; color: white; padding: 8px 12px; border-radius: 10px; cursor: pointer; }

        /* Список блюд */
        .meal-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #2d3139; }
        .meal-item:last-child { border-bottom: none; }
        .meal-info b { display: block; font-size: 15px; }
        .meal-info span { font-size: 12px; color: var(--text-sec); }
        .meal-cal { font-weight: bold; color: var(--accent); margin-right: 15px; }
        .btn-del { color: var(--danger); font-size: 18px; cursor: pointer; padding: 5px; }

        /* Формы и кнопки */
        input { width: 100%; padding: 12px; margin-bottom: 12px; background: #2d3139; border: 1px solid #3e4451; color: white; border-radius: 12px; font-size: 16px; outline: none; }
        input:focus { border-color: var(--accent); }
        .btn-main { width: 100%; padding: 16px; background: var(--accent); color: #000; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; transition: transform 0.1s; }
        .btn-main:active { transform: scale(0.98); }
        .fab { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 5px 20px rgba(46, 204, 113, 0.4); border: none; cursor: pointer; }

        /* Модалка */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: flex-end; z-index: 1000; }
        .modal-content { background: var(--card); width: 100%; border-radius: 25px 25px 0 0; padding: 25px; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="app">
        <!-- УПРАВЛЕНИЕ ДАТОЙ -->
        <div class="date-control">
            <button class="date-btn" onclick="changeDate(-1)">←</button>
            <b id="currentDateLabel">Сегодня</b>
            <button class="date-btn" onclick="changeDate(1)">→</button>
        </div>

        <!-- ГЛАВНАЯ КАРТОЧКА -->
        <div class="card" onclick="openSettings()">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                    <span style="color: var(--text-sec); font-size: 13px;">Потреблено ккал</span>
                    <div style="font-size: 32px; font-weight: 800;"><span id="curCal">0</span> <span style="font-size: 18px; color: var(--text-sec);">/ <span id="maxCal">2100</span></span></div>
                </div>
                <div style="font-size: 24px;">⚙️</div>
            </div>
            <div class="progress-container"><div id="pBar" class="progress-fill"></div></div>
            <div class="stats-grid">
                <div class="stat-item"><span class="stat-val" id="sumP">0г</span><span class="stat-label">Белки</span></div>
                <div class="stat-item"><span class="stat-val" id="sumF">0г</span><span class="stat-label">Жиры</span></div>
                <div class="stat-item"><span class="stat-val" id="sumC">0г</span><span class="stat-label">Углеводы</span></div>
            </div>
        </div>

        <!-- СПИСОК -->
        <div id="mealListContainer"></div>

        <button class="fab" onclick="toggleModal(true)">+</button>
    </div>

    <!-- МОДАЛКА НАСТРОЕК -->
    <div id="settingsModal" class="modal hidden">
        <div class="modal-content">
            <h3>Настройки нормы</h3>
            <label style="color: var(--text-sec); font-size: 12px;">Дневная цель калорий:</label>
            <input type="number" id="setLimit" placeholder="2100">
            <button class="btn-main" onclick="saveSettings()">Применить</button>
            <button style="background:none; border:none; color:var(--text-sec); width:100%; margin-top:15px;" onclick="closeSettings()">Отмена</button>
        </div>
    </div>

    <!-- МОДАЛКА ДОБАВЛЕНИЯ -->
    <div id="addModal" class="modal hidden">
        <div class="modal-content">
            <h3 style="margin-top: 0;">Добавить прием пищи</h3>
            <input type="text" id="mName" placeholder="Название (например, Гречка)">
            <input type="number" id="mWeight" placeholder="Вес (граммы)">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <input type="number" id="mP" placeholder="Белки на 100г">
                <input type="number" id="mF" placeholder="Жиры на 100г">
                <input type="number" id="mC" placeholder="Угл. на 100г">
                <input type="number" id="mK" placeholder="Ккал на 100г">
            </div>
            <button class="btn-main" onclick="addEntry()">Добавить в дневник</button>
            <button style="background:none; border:none; color:var(--text-sec); width:100%; margin-top:15px;" onclick="toggleModal(false)">Закрыть</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = "#0f1012";

        let viewDate = new Date();
        let settings = JSON.parse(localStorage.getItem('fitSettings') || '{"limit": 2100}');
        let db = JSON.parse(localStorage.getItem('fitEntries') || '[]');

        function formatDate(date) { return date.toISOString().split('T')[0]; }

        function updateUI() {
            const dateStr = formatDate(viewDate);
            const isToday = dateStr === formatDate(new Date());
            document.getElementById('currentDateLabel').innerText = isToday ? "Сегодня" : dateStr;
            
            const dayEntries = db.filter(e => e.date === dateStr);
            let totals = { cal: 0, p: 0, f: 0, c: 0 };
            let html = '';

            dayEntries.forEach(e => {
                totals.cal += e.cal; totals.p += e.p; totals.f += e.f; totals.c += e.c;
                html += `
                <div class="meal-item">
                    <div class="meal-info"><b>${e.name}</b><span>${e.weight}г • БЖУ: ${e.p}/${e.f}/${e.c}</span></div>
                    <div style="display:flex; align-items:center;">
                        <div class="meal-cal">${e.cal}</div>
                        <div class="btn-del" onclick="deleteEntry(${e.id})">✕</div>
                    </div>
                </div>`;
            });

            document.getElementById('mealListContainer').innerHTML = html || '<p style="text-align:center; color:gray; margin-top:40px;">Нет записей за этот день</p>';
            document.getElementById('curCal').innerText = totals.cal;
            document.getElementById('maxCal').innerText = settings.limit;
            document.getElementById('sumP').innerText = totals.p + 'г';
            document.getElementById('sumF').innerText = totals.f + 'г';
            document.getElementById('sumC').innerText = totals.c + 'г';
            
            const perc = (totals.cal / settings.limit) * 100;
            document.getElementById('pBar').style.width = Math.min(perc, 100) + '%';
            document.getElementById('pBar').style.background = perc > 100 ? '#ef4444' : '#2ecc71';
        }

        function changeDate(days) {
            viewDate.setDate(viewDate.getDate() + days);
            updateUI();
        }

        function toggleModal(show) { document.getElementById('addModal').classList.toggle('hidden', !show); }
        function openSettings() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function closeSettings() { document.getElementById('settingsModal').classList.add('hidden'); }

        function saveSettings() {
            const val = parseInt(document.getElementById('setLimit').value);
            if(val > 0) {
                settings.limit = val;
                localStorage.setItem('fitSettings', JSON.stringify(settings));
                closeSettings();
                updateUI();
            }
        }

        function addEntry() {
            const name = document.getElementById('mName').value;
            const w = parseFloat(document.getElementById('mWeight').value);
            const k100 = parseFloat(document.getElementById('mK').value);
            
            if(!name || !w || !k100) return alert("Заполни название, вес и ккал!");

            const entry = {
                id: Date.now(),
                date: formatDate(viewDate),
                name: name,
                weight: w,
                p: Math.round((parseFloat(document.getElementById('mP').value || 0) * w) / 100),
                f: Math.round((parseFloat(document.getElementById('mF').value || 0) * w) / 100),
                c: Math.round((parseFloat(document.getElementById('mC').value || 0) * w) / 100),
                cal: Math.round((k100 * w) / 100)
            };

            db.push(entry);
            localStorage.setItem('fitEntries', JSON.stringify(db));
            toggleModal(false);
            updateUI();
            
            // Очистка полей
            ['mName','mWeight','mP','mF','mC','mK'].forEach(id => document.getElementById(id).value = '');
        }

        function deleteEntry(id) {
            db = db.filter(e => e.id !== id);
            localStorage.setItem('fitEntries', JSON.stringify(db));
            updateUI();
        }

        updateUI();
    </script>
</body>
</html>
